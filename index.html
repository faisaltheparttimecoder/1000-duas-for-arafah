<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="1000 supplications for the Day of Arafah and beyond. A serene, reverent collection of duas."
        />
        <title>1000 Duas for Arafah</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <script>
            (function () {
                const stored = localStorage.getItem('duas:theme');
                const theme = stored || 'system';
                let resolved = theme;
                if (theme === 'system') {
                    resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.setAttribute('data-theme', resolved);
            })();
        </script>
    </head>

    <body>
        <a href="#main-content" class="skip-link">Skip to content</a>

        <header class="top-bar" role="banner">
            <div class="top-bar-content">
                <div class="top-bar-left">
                    <button
                        class="menu-toggle"
                        aria-label="Toggle sections menu"
                        aria-expanded="false"
                        aria-controls="sidebar"
                    >
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 class="site-title">1000 Duas</h1>
                </div>

                <div class="top-bar-right">
                    <div class="lang-switcher" role="group" aria-label="Language">
                        <button
                            class="lang-btn active"
                            type="button"
                            data-lang="en"
                            aria-pressed="true"
                        >
                            EN
                        </button>
                        <button class="lang-btn" type="button" data-lang="ar" aria-pressed="false">
                            AR
                        </button>
                    </div>

                    <div class="search-container">
                        <label for="search-input" class="visually-hidden">Search duas</label>
                        <svg
                            class="search-icon"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input
                            type="search"
                            id="search-input"
                            placeholder="Search duas..."
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <button class="search-clear" aria-label="Clear search" hidden>
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <div class="view-switcher" role="group" aria-label="View mode">
                        <button
                            class="view-btn active"
                            data-view="cards"
                            aria-label="Cards view"
                            aria-pressed="true"
                        >
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <button
                            class="view-btn"
                            data-view="list"
                            aria-label="List view"
                            aria-pressed="false"
                        >
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                        <button
                            class="view-btn"
                            data-view="table"
                            aria-label="Table view"
                            aria-pressed="false"
                        >
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                        </button>
                    </div>

                    <button
                        class="pdf-download-btn"
                        id="pdf-download"
                        aria-label="Download as PDF"
                        title="Download all duas as PDF"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>PDF</span>
                    </button>

                    <button class="theme-toggle" aria-label="Theme: System">
                        <svg
                            class="theme-icon"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sections">
                <div class="sidebar-content">
                    <h2 class="sidebar-title">Sections</h2>
                    <nav class="sections-list" id="sections-nav"></nav>
                </div>
            </aside>

            <main class="main-content" id="main-content" role="main">
                <div class="content-header" id="content-header" hidden>
                    <h2 class="results-title"></h2>
                </div>
                <div class="duas-container" id="duas-container" data-view="cards"></div>
            </main>
        </div>

        <div class="modal-backdrop" id="modal-backdrop" hidden>
            <div
                class="modal"
                id="dua-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
            >
                <button class="modal-close" aria-label="Close">
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <div class="modal-header">
                    <div class="modal-meta">
                        <div class="modal-number-label">
                            No. <span id="modal-number"></span> / 1000
                        </div>
                        <div class="modal-section" id="modal-section"></div>
                    </div>
                </div>

                <div class="modal-body">
                    <div class="modal-bismillah">In the name of Allah</div>
                    <p class="modal-text" id="modal-text"></p>
                    <div class="modal-ameen">— Ameen —</div>
                </div>

                <div class="modal-nav">
                    <button class="modal-nav-btn" id="modal-prev" aria-label="Previous dua">
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="modal-nav-btn" id="modal-next" aria-label="Next dua">
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="modal-footer">
                    <button class="modal-action-btn" id="modal-star" aria-label="Star">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <polygon
                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                            ></polygon>
                        </svg>
                        <span>Star</span>
                    </button>
                    <button class="modal-action-btn" id="modal-copy" aria-label="Copy">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path
                                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                            ></path>
                        </svg>
                        <span>Copy</span>
                    </button>
                    <button class="modal-action-btn" id="modal-share" aria-label="Share">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast" hidden></div>

        <footer class="footer" role="contentinfo">
            <p>1000 supplications, gathered for the Day of Arafah.</p>
            <p class="footer-small">May Allah accept.</p>
        </footer>

        <script type="module" src="assets/js/app.js"></script>
    </body>
</html>
